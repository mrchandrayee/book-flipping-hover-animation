<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Flipping Hover Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="credit">Coding.stella × Julianvelez1997</div>
    <h1>Book Flipping Hover Animation</h1>
    <p class="intro">Move your pointer over the book to flip the page.</p>
    <a class="code-link" href="#demo">Try the animation</a>

    <section class="showcase" id="demo">
      <div class="section-label">RESULT</div>
      <div class="book-scene">
        <article class="book" tabindex="0" aria-label="Interactive flipping book. Hover or focus to flip.">
          <div class="back-page"></div>
          <div class="left-page"><span>OH!!</span></div>
          <div class="right-page"><span>STELLA</span></div>
          <div class="flipping-page">
            <div class="page-front"></div>
            <div class="page-back"></div>
          </div>
        </article>
      </div>
      <div class="hint">HOVER / FOCUS TO FLIP</div>
    </section>
    <section class="details">
      <div><span class="dot purple"></span> Front cover</div>
      <div><span class="dot pink"></span> Back cover</div>
      <div><span class="dot gray"></span> Turning page</div>
    </section>
    <footer>Pure HTML &amp; CSS · Responsive · 3D transform animation</footer>
  </main>
</body>
</html>
